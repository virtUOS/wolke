version: 2
updates:
  # Backend Go modules (incl. the pinned go tools: goose, sqlc, golangci-lint).
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      semver-major-days: 14
      semver-minor-days: 14
    open-pull-requests-limit: 5
    groups:
      go-modules:
        patterns: ["*"]

  # Frontend npm dependencies.
  - package-ecosystem: npm
    directory: "/web-ui"
    schedule:
      interval: weekly
    cooldown:
      semver-major-days: 14
      semver-minor-days: 14
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint's peer range caps TypeScript at <6.1.0, so TS 7 (the
      # native port) cannot be installed alongside our linter. Drop this once
      # typescript-eslint ships TS 7 support. See PR #65.
      - dependency-name: "typescript"
        versions: [">=7"]
    groups:
      npm-prod:
        dependency-type: production
      npm-dev:
        dependency-type: development

  # Container base images (Dockerfile + compose.yaml).
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # GitHub Actions used by the workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
