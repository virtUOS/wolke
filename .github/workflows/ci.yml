name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run coverage
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            pct=$(node -p "require('./coverage/coverage-summary.json').total.lines.pct")
            echo "### Frontend coverage: ${pct}% lines" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: web-ui/coverage
          retention-days: 7
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: spa-dist
          path: web-ui/dist
          retention-days: 1

  backend:
    name: Backend (lint, test+coverage, embedded build)
    runs-on: ubuntu-latest
    needs: frontend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: wolke
          POSTGRES_PASSWORD: devpass
          POSTGRES_DB: wolke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wolke -d wolke"
          --health-interval 5s --health-timeout 3s --health-retries 10
      mock-oidc:
        image: ghcr.io/navikt/mock-oauth2-server:2.1.10
        ports:
          - 8455:8080
        env:
          JSON_CONFIG: '{"interactiveLogin":false,"tokenCallbacks":[{"issuerId":"default","requestMappings":[{"requestParam":"client_id","match":"wolke","claims":{"sub":"stud-1","name":"Test Student","email":"stud@example.edu","eduPersonAffiliation":"student","groups":["dashboard-admins"]}}]}]}'
    env:
      DATABASE_URL: postgres://wolke:devpass@localhost:5432/wolke?sslmode=disable
      # IPv4: mock-oauth2-server crashes on IPv6 peers.
      OIDC_TEST_ISSUER: http://127.0.0.1:8455/default
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
      - name: Download SPA build
        uses: actions/download-artifact@v8
        with:
          name: spa-dist
          path: dist-artifact
      - name: Lint
        run: go tool golangci-lint run ./...
      - name: Apply migrations
        run: go tool goose -dir migrations postgres "$DATABASE_URL" up
      - name: Seed dev catalog
        # The DB-backed integration tests assert against the dev seed (categories,
        # services, role defaults). Mirrors `make seed`; psql ships on the runner.
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f dev/seed.sql
      - name: Wait for mock OIDC
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "$OIDC_TEST_ISSUER/.well-known/openid-configuration" >/dev/null; then
              echo "mock OIDC ready"; exit 0
            fi
            sleep 1
          done
          echo "mock OIDC did not become ready"; exit 1
      - name: Test (race + coverage, with real Postgres + mock OIDC)
        run: go test -race -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...
      - name: Coverage summary
        if: always()
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}')
          echo "### Backend coverage: ${total} statements" >> "$GITHUB_STEP_SUMMARY"
          go tool cover -html=coverage.out -o coverage.html
      - uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: |
            coverage.out
            coverage.html
          retention-days: 7
      - name: Build embedded binary
        run: |
          # Use the SPA built by the frontend job so the embed is the real app.
          rm -rf internal/web/dist/assets
          cp -r dist-artifact/* internal/web/dist/
          go build -o bin/server ./cmd/server

  e2e:
    name: E2E (Playwright viewport matrix)
    runs-on: ubuntu-latest
    needs: frontend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: wolke
          POSTGRES_PASSWORD: devpass
          POSTGRES_DB: wolke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wolke -d wolke"
          --health-interval 5s --health-timeout 3s --health-retries 10
      mock-oidc:
        image: ghcr.io/navikt/mock-oauth2-server:2.1.10
        ports:
          - 8455:8080
        env:
          JSON_CONFIG: '{"interactiveLogin":false,"tokenCallbacks":[{"issuerId":"default","requestMappings":[{"requestParam":"client_id","match":"wolke","claims":{"sub":"stud-1","name":"Test Student","email":"stud@example.edu","eduPersonAffiliation":"student","groups":["dashboard-admins"]}}]}]}'
    env:
      DATABASE_URL: postgres://wolke:devpass@localhost:5432/wolke?sslmode=disable
      # IPv4: mock-oauth2-server crashes on IPv6 peers.
      OIDC_TEST_ISSUER: http://127.0.0.1:8455/default
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - run: npm ci
        working-directory: web-ui
      - name: Download SPA build
        uses: actions/download-artifact@v8
        with:
          name: spa-dist
          path: dist-artifact
      - name: Apply migrations
        run: go tool goose -dir migrations postgres "$DATABASE_URL" up
      - name: Seed dev catalog
        # The suite asserts against the dev seed (the catalog the tiles render).
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f dev/seed.sql
      - name: Wait for mock OIDC
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "$OIDC_TEST_ISSUER/.well-known/openid-configuration" >/dev/null; then
              echo "mock OIDC ready"; exit 0
            fi
            sleep 1
          done
          echo "mock OIDC did not become ready"; exit 1
      - name: Build embedded binary
        # The suite drives the shipped artifact, not the Vite dev server, so a
        # dev-server-only layout difference can never hide a viewport bug.
        run: |
          rm -rf internal/web/dist/assets
          cp -r dist-artifact/* internal/web/dist/
          go build -o bin/server ./cmd/server
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: web-ui
      - name: Run the viewport suite
        run: npx playwright test
        working-directory: web-ui
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web-ui/playwright-report
          retention-days: 7

  image:
    name: Build, scan + push to GHCR
    runs-on: ubuntu-latest
    # Only publish once every check passes — frontend, backend AND the viewport
    # e2e suite must be green (the Dockerfile rebuilds the SPA + binary itself,
    # so there is no artifact dependency).
    needs: [frontend, backend, e2e]
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        # Skip on pull_request: fork PRs don't get packages:write, and PR runs
        # only validate the build (push is disabled below).
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          # Build into the runner's Docker daemon and never push from here: the
          # image is scanned first, and the image that ships must be the image
          # that was scanned. The Push step below sends this exact loaded image
          # — nothing is rebuilt between scan and publish, so no cache is
          # trusted to make two builds identical. `load` is single-platform
          # only, which is fine: we build amd64 only.
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record the scanned image
        id: scanned
        env:
          # TEETH CHECK (#239) — revert: scan a knowingly vulnerable image.
          REF: docker.io/library/alpine:3.18.0
        run: |
          docker pull "$REF"
          id=$(docker image inspect --format '{{.Id}}' "$REF")
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "Scanning $REF = $id"
      - name: Scan image
        id: scan
        # Pinned to a commit, not a tag: this third-party action runs in a job
        # holding packages:write and security-events:write, and tags can move.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # Scan the image loaded above, never a registry copy. Without this,
          # Trivy falls back to pulling the ref remotely — and on main that
          # ref (`latest`) still names the previous release, so a miss would
          # silently scan the old image.
          TRIVY_IMAGE_SRC: docker
        with:
          image-ref: ${{ steps.scanned.outputs.ref }}
          # Vulnerabilities only. Trivy also runs its secret scanner by default;
          # secret scanning is a separate decision (#239 scopes it out).
          scanners: vuln
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          # Without this the action drops `severity` for SARIF output, and the
          # exit code then fires on MEDIUM/LOW too.
          limit-severities-for-sarif: true
          # Block only on what we can act on: a CVE with no released fix would
          # keep the gate red with nothing to do but learn to ignore it.
          ignore-unfixed: true
          exit-code: 1
          # The vulnerability DB pull is rate-limited and flaky uncached.
          cache: true
      - name: Scan summary
        # Separates "Trivy found N vulnerabilities" from "Trivy could not run"
        # (both exit non-zero), and fails if Trivy ever exits 0 without a report.
        if: ${{ !cancelled() && steps.scan.outcome != 'skipped' }}
        env:
          REF: ${{ steps.scanned.outputs.ref }}
        run: scripts/trivy-summary.sh trivy.sarif "$REF"
      - name: Upload scan to code scanning
        # Skip on pull_request: fork PRs get a read-only GITHUB_TOKEN without
        # security-events:write, so the upload 403s. PRs see the verdict in the
        # job summary; main/tags record it in the Security tab. Runs after a
        # failed scan too — that is exactly when the alerts matter.
        if: ${{ !cancelled() && github.event_name != 'pull_request' && hashFiles('trivy.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          # Shared with security-scan.yml: both describe the image on main, so
          # a weekly rescan updates the same alerts instead of duplicating them.
          category: trivy-image
      - name: Push
        # Build on every run, but only publish on non-PR events. PR runs
        # (including Dependabot and forks) get a read-only GITHUB_TOKEN without
        # packages:write — and the GHCR login above is skipped — so a push 403s.
        # PRs therefore validate the build only; main/tags publish.
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker push "$tag"
          done
      - name: Verify the pushed image is the scanned image
        # The property the scan rests on, checked rather than assumed: every
        # pushed tag must resolve to the image ID Trivy scanned. The image ID
        # is the digest of the image config, which pins every layer by content.
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          SCANNED: ${{ steps.scanned.outputs.id }}
        run: |
          status=0
          for tag in $TAGS; do
            manifest=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest)
            config=$(docker buildx imagetools inspect "$tag" --raw | jq -r .config.digest)
            echo "$tag -> manifest $manifest, config $config"
            if [ "$config" != "$SCANNED" ]; then
              echo "::error::$tag was pushed as config $config, but Trivy scanned $SCANNED"
              status=1
            fi
          done
          {
            echo "### Scanned vs pushed"
            echo
            echo "Scanned image ID: \`$SCANNED\`"
            echo
            echo "Pushed manifest: \`$manifest\` (config \`$config\`)"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
