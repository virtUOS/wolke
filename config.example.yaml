# Structured runtime configuration (docs/02 §6, §11). Copy to config.yaml and
# point CONFIG_FILE at it. This file owns the nested maps — the OIDC claim
# mapping and the branding theme — which environment variables intentionally
# CANNOT override (env overrides only top-level scalars). Secrets stay in env.
#
# Everything below shows the built-in defaults (the UOS skin), except the OIDC
# role block, which shows the UOS launch deployment's two-role mapping (the
# built-in default is a three-role example). A fork re-skins and re-points by
# editing this one file and restarting — no recompile.

# OIDC is provider-agnostic: discovery does the rest, so the same code works with
# Keycloak, Authentik, Zitadel, Auth0, Entra, etc. (docs/02 §6).
#
# Back-channel logout (logout at the IdP ends wolke sessions) needs no config
# here: register PUBLIC_URL + /auth/backchannel-logout as the client's
# back-channel logout URL at the IdP — see docs/oidc-keycloak.md.
oidc:
  # issuer_url / client_id / client_secret / scopes are scalars — set via env
  # (OIDC_ISSUER_URL, …) in deployments. Shown here for reference.
  scopes: [openid, profile, email]
  # Which claim carries affiliation, and how its values map to roles.
  #
  # THIS BLOCK DEFINES THE ROLE SET. The roles are the distinct slugs in
  # values ∪ precedence ∪ {default} — there is no separate role list. Slugs
  # match [a-z0-9-]{1,32}; `all` is reserved (the announcement audience meaning
  # everyone); a violation fails startup. More than five roles works but logs a
  # warning: the per-role admin screens are designed for a handful.
  #
  # Shown here: the UOS deployment, whose IdM can only distinguish students from
  # employees. (The *built-in* defaults are a three-role example —
  # faculty→teacher, employee/member→staff, student→student — so an unmounted
  # config still runs.) Supplying this block replaces the built-in one WHOLE —
  # claim, values, precedence, default and labels together — so set all of it,
  # not just the keys you want to change.
  role:
    claim: eduPersonAffiliation
    values:                                 # claim value -> role slug
      student: student
      employee: staff
    precedence: [staff, student]            # if several match, first wins
    default: student                        # if none match
    labels:                                 # optional; default = capitalized slug
      student: { de: "Studierende", en: "Students" }
      staff:   { de: "Mitarbeitende", en: "Staff" }
  # How to detect a dashboard admin (supports a nested claim path).
  admin:
    claim: groups
    match: dashboard-admins

# Branding / theme — applied by the SPA as CSS variables at runtime. Keep the
# token NAMES stable (docs/03 §2); only values change. The brand hex values are
# read from the mockups and are still TBD against the UOS Corporate Design
# manual (concept §8.1).
branding:
  product_name: "wolke"
  org_name: "Universität Osnabrück"
  logo_light: /branding/logo-light.svg
  logo_dark: /branding/logo-dark.svg
  favicon: /branding/favicon.svg
  default_locale: de
  # Legal footer links (institution-specific). Leave empty to hide a link.
  imprint_url: "https://www.uni-osnabrueck.de/impressum/"
  privacy_url: "https://www.uni-osnabrueck.de/datenschutz/"
  # Right-aligned feedback link in the footer (env: FEEDBACK_URL). An http(s) URL
  # or an email / mailto: address. Empty hides it.
  feedback_url: ""
  # Top-bar quick actions (env: BOT_URL / HELP_URL). Each button is hidden when
  # empty. bot_url opens a chatbot in a new tab; help_url opens an http(s) URL in
  # a new tab, or a phone number / tel: link (opens the dialer on a phone).
  bot_url: ""
  help_url: ""
  # Embedded assistant chat widget (launcher mode), e.g. eule
  # (github.com/virtUOS/eule). Active only when BOTH are set; supersedes the
  # bot_url top-bar link. The widget URL's origin doubles as the widget's
  # gateway base URL and is added to the CSP (script-src/connect-src). The
  # dashboard's own origin must be listed in the bot's embedding
  # allowed_origins on the assistant side, or its API will refuse (CORS).
  # (env: ASSISTANT_WIDGET_URL / ASSISTANT_BOT_ID)
  assistant_widget_url: ""  # e.g. "https://assistant.example.edu/widget.js"
  assistant_bot_id: ""      # e.g. "echo"
  # Any token from the docs/03 §2 table may be set in either map — the five
  # shown are just the ones most skins change. The rest (surface_2, border,
  # text_muted, info, warning, success, danger) fall back to the bundled
  # defaults when omitted. Payload keys use `_`; they become --kebab-case CSS
  # variables (primary_hover → --primary-hover).
  theme:
    light:
      primary: "#A6093D"
      primary_hover: "#8A0732"
      accent: "#F2C879"
      surface: "#F4F4F5"
      text: "#18181B"
    dark:
      primary: "#C2355C"
      primary_hover: "#A6093D"
      accent: "#F2C879"
      surface: "#1E1E21"
      text: "#F4F4F5"
